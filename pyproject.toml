[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "session-search"
version = "0.2.0"
description = "Local search and recovery across AI coding sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Timothy Joo" }]
keywords = ["ai", "cli", "codex", "claude-code", "developer-tools", "search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
semantic = ["fastembed>=0.7,<0.8"]
dev = ["coverage>=7,<8"]

[project.scripts]
ss = "session_search:main"
sessions = "session_search:main"

[project.urls]
Repository = "https://github.com/tjp2021/session-search"

[tool.setuptools]
py-modules = [
  "adapter_capabilities",
  "archive_intent",
  "archive_store",
  "card_quality",
  "demo_runner",
  "platform_lock",
  "public_corpus",
  "retrieval_eval",
  "schema_migrations",
  "secret_patterns",
  "session_search",
  "ss_adapters",
  "ss_cards",
  "ss_cli",
  "ss_config",
  "ss_dashboard",
  "ss_packets",
  "ss_retrieval",
]

[tool.setuptools.data-files]
"share/session-search/evals" = [
  "evals/archive-intent-corpus.json",
  "evals/public-retrieval-corpus.json",
  "evals/public-card-quality-corpus.json",
]
